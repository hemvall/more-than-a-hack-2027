name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Workflow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPolicy } = require('./.github/scripts/check-policy.cjs');
            const pr = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            if (commits.length !== pr.commits) {
              throw new Error('Incomplete commit list; split this PR into smaller changes');
            }
            const number = checkPolicy(pr, commits);
            const { data: issue } = await github.rest.issues.get({
              ...context.repo, issue_number: number
            });
            if (issue.pull_request) throw new Error('Link an issue, not a pull request');
            core.info('Workflow references issue #' + number);

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: node --test .github/scripts/check-policy.test.cjs
      - name: Validate supplied baseline submissions
        shell: bash
        run: |
          set -euo pipefail
          for file in evaluation/results/baseline_*.csv; do
            python evaluation/validate_submission.py "$file"
          done
      - name: Evaluate public baselines
        run: python evaluation/run_evaluation.py --gt public --bootstrap 0 --no-detail
